<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aventura de Idiomas · V25</title><link rel="stylesheet" href="style.css"></head><body><main class="screen"><div class="backdrop"></div><div class="artboard"><img class="master" src="mundo_inicio.png" alt="Mundo de Aventura de Idiomas"><div id="robot" class="robot"><img src="robot_animado.png" alt="Robot compañero"></div><div class="water" aria-hidden="true"></div><div id="speech" class="speech"><strong>¡Hola!</strong><span>Vamos a tener una gran aventura.<br>¿Cómo te llamas?</span></div><button id="lang" class="hot lang" aria-label="Español"></button><button id="juega" class="hot juega" aria-label="Juega"></button><button id="aprende" class="hot aprende" aria-label="Aprende"></button><button id="explora" class="hot explora" aria-label="Explora"></button><button id="crece" class="hot crece" aria-label="Crece"></button><section class="name-card"><input id="name" placeholder="Escribe tu nombre" autocomplete="name" aria-label="Escribe tu nombre"><button id="continue" class="continue">Continuar →</button><button id="voice" class="voice">🎙️ Decírmelo</button><p>La voz es opcional si el navegador no la permite.</p><div id="micState" class="micState" aria-live="polite"></div></section></div><div id="live" class="sr" aria-live="polite"></div></main><script src="app.js"></script></body></html>
