<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura de Idiomas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="welcome" class="screen active">
      <div class="orb">🌎</div>
      <h1>¡Aprender un idioma es una aventura!</h1>
      <p>Explora, juega y aprende con tu compañero.</p>
      <button onclick="showScreen('profile')">🚀 Comenzar aventura</button>
    </section>

    <section id="profile" class="screen">
      <div class="character">🧸</div>
      <h2>¡Vamos a conocerte!</h2>
      <p>Primero crearemos tu perfil.</p>
      <label for="name">¿Cómo te llamas?</label>
      <input id="name" type="text" placeholder="Escribe tu nombre">
      <button onclick="saveProfile()">Continuar ➜</button>
      <p id="message" class="message"></p>
    </section>

    <section id="next" class="screen">
      <div class="character">✨</div>
      <h2 id="hello"></h2>
      <p>¡Tu aventura apenas comienza!</p>
      <button onclick="showScreen('profile')">← Volver</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
